name: CI/CD

# Berjalan otomatis saat push atau pull request ke branch main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hak akses minimal (least privilege). Job yang butuh lebih akan menambahkannya sendiri.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1. Lint + unit test
  # ---------------------------------------------------------------
  lint-test:
    name: Lint & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependency
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit test (pytest)
        run: pytest -q

  # ---------------------------------------------------------------
  # 2. Secret scanning (cari password/token yang tidak sengaja ter-commit)
  # ---------------------------------------------------------------
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # 2b. Validasi Terraform (validate + plan offline tanpa akun cloud)
  # ---------------------------------------------------------------
  terraform-validate:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Init (tanpa backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      # Plan memakai kredensial dummy (offline_plan=true). Tidak memblokir pipeline
      # kalau gagal, karena tugas hanya mensyaratkan validate dan plan.
      - name: Plan (offline)
        continue-on-error: true
        run: terraform plan -input=false -lock=false -no-color

  # ---------------------------------------------------------------
  # 3. Build image -> scan kerentanan (Trivy) -> push ke GHCR (tag commit SHA)
  # ---------------------------------------------------------------
  build-scan-push:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest
    needs: [lint-test, secret-scan]
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Membuat tag berbasis commit SHA (nama image otomatis huruf kecil, syarat GHCR).
      - name: Metadata image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Build dulu ke lokal supaya bisa di-scan SEBELUM dipush.
      - name: Build image (lokal, untuk scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scan-target:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan kerentanan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login ke GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push hanya saat push ke main (bukan saat pull request).
      - name: Push image (tag = commit SHA)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ---------------------------------------------------------------
  # 4. Simulasi deploy ke staging
  #    Menjalankan image yang baru dipush + PostgreSQL, lalu cek /health.
  # ---------------------------------------------------------------
  deploy-staging:
    name: Deploy ke Staging (simulasi)
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.event_name == 'push'
    environment: staging
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: staging_user
          POSTGRES_PASSWORD: staging_pass_ci
          POSTGRES_DB: staging_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staging_user -d staging_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Jalankan image hasil build di staging
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ needs.build-scan-push.outputs.version }}"
          echo "Deploy image: $IMAGE"
          docker pull "$IMAGE"
          docker run -d --name trx-api-staging --network host \
            -e DATABASE_URL="postgresql+pg8000://staging_user:staging_pass_ci@127.0.0.1:5432/staging_db" \
            "$IMAGE"

      - name: Smoke test (/health dan /metrics)
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo ""; echo "Health check OK"; break
            fi
            echo "Menunggu API siap ($i/20)..."; sleep 3
            if [ "$i" = "20" ]; then docker logs trx-api-staging; exit 1; fi
          done
          curl -fsS http://127.0.0.1:8000/metrics | head -n 5

      # Aktif otomatis setelah folder k8s/ dibuat (tahap Kubernetes).
      - name: Validasi manifest Kubernetes (dry-run)
        if: ${{ hashFiles('k8s/*.yaml') != '' }}
        run: kubectl apply --dry-run=client --validate=false -f k8s/

      - name: Ringkasan deploy
        run: |
          echo "### Staging deploy (simulasi) berhasil" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`ghcr.io/${GITHUB_REPOSITORY,,}:${{ needs.build-scan-push.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
